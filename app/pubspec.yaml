name: trading_bot
description: Real-time trading signal dashboard with BLoC state management.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Functional programming (Either, Option)
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.7.0

  # HTTP client
  http: ^1.2.1

  # WebSocket
  web_socket_channel: ^2.4.5

  # Charts
  fl_chart: ^0.67.0

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # BLoC testing
  bloc_test: ^9.1.7

  # Mocking
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
