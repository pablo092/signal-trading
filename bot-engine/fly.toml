# bot-engine — Fly.io deployment config
#
# Public API + WebSocket. Every /api/v1/* and /ws route requires a scoped token
# (ADR-003); the paper guard is enforced and every order needs a human approval.
# Deploy with: cd bot-engine && flyctl deploy
#
# Secrets (flyctl secrets set ... — never put real values here):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY   Alpaca PAPER keys
#   AUTH_TOKENS                         token table (docs/runbooks/SERVICE_TOKENS.md)
#   SIGNAL_SERVICE_TOKEN                bot-engine -> signal-service token

app            = "trading-bot-engine"
primary_region = "iad"    # same region as signal-service

[build]
  dockerfile = "Dockerfile"

[env]
  ENV                     = "production"
  PORT                    = "8080"
  PAPER_TRADING           = "true"
  # ADR-006 phase 1 (paper execution), started by the owner on 2026-11-27. Set to
  # "false" to go back to phase 0: pending intents stay, approval is refused.
  ORDER_EXECUTION_ENABLED = "true"
  ALPACA_BASE_URL         = "https://paper-api.alpaca.markets"
  # Public https address of signal-service (token-authenticated). Flycast over plain
  # http does not work: signal-service's force_https redirects it to https on the
  # .flycast name, which has no TLS (the request fails with EOF).
  SIGNAL_SERVICE_URL      = "https://trading-bot-signal-service.fly.dev"
  # Browser origins of the local demo app (flutter run -d chrome --web-port 5000).
  # Every call still needs a token held only by that local build.
  CORS_ALLOWED_ORIGINS    = "http://localhost:5000"
  WS_ALLOWED_ORIGINS      = "http://localhost:5000"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "off"   # always on: it owns the WebSocket feed
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "15s"
    method       = "GET"
    path         = "/health/ready"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 256

[[metrics]]
  port = 8080
  path = "/metrics"
