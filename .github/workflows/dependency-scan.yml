# Dependency vulnerability scanning (BL-12). Same commands as `make audit`.
name: Dependency scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # weekly, Monday 09:00 UTC

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          for f in signal-service/requirements.lock signal-service/requirements-dev.lock \
                   agent-gateway/requirements.lock agent-gateway/requirements-dev.lock; do
            uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r "$f"
          done

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bot-engine/go.mod
      - working-directory: bot-engine
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1 scan source --lockfile app/pubspec.lock
