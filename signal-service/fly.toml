# signal-service — Fly.io deployment config
#
# Public over HTTPS, but every /api/v1/* route requires a scoped token (ADR-003).
# bot-engine reaches it privately over Flycast (http://trading-bot-signal-service.flycast);
# the Vercel demo proxy (api/ at the repo root) reaches it at https://<app>.fly.dev.
# Deploy with: cd signal-service && flyctl deploy
#
# Secrets (flyctl secrets set ... — never put real values here):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY   Alpaca PAPER keys (market data)
#   AUTH_TOKENS                         token table (docs/runbooks/SERVICE_TOKENS.md)

app            = "trading-bot-signal-service"
primary_region = "iad"    # us-east — close to Alpaca servers

[build]
  dockerfile = "Dockerfile"
  target     = "runtime"

[env]
  ENVIRONMENT      = "production"
  PORT             = "8000"
  PAPER_TRADING    = "true"
  LOG_LEVEL        = "INFO"
  ALPACA_DATA_FEED = "iex"

[http_service]
  internal_port        = 8000
  force_https          = true    # public traffic; Flycast (private) stays plain http
  auto_stop_machines   = "stop"  # sleeps when idle; any request wakes it (cold start ~seconds)
  auto_start_machines  = true
  min_machines_running = 0

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "20s"
    method       = "GET"
    path         = "/health/ready"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512

[[metrics]]
  port = 8000
  path = "/metrics"
